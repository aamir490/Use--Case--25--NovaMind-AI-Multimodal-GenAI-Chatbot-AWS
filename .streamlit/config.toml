[server]
headless = true
address = "0.0.0.0"
port = 8501
# Keep Streamlit's origin and request-forgery protections enabled behind proxies.
enableCORS = true
enableXsrfProtection = true
# Maximum accepted upload (MiB); application validation sets lower type limits.
maxUploadSize = 5

[browser]
gatherUsageStats = false
